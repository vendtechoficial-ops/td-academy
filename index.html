<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>TD Academy</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Manrope:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F4F0;--paper:#FFFFFF;--paper2:#EEECE6;--ink:#15131F;--ink2:#5A586B;--ink3:#8E8C9C;--line:#E1DED5;--night:#121019;--night2:#1D1B2A;--brand:#7A2CFF;--accent:#00A97E;--ok:#0E8F64;--okbg:#E2F5EC;--warn:#A86A06;--warnbg:#FBF0DA;--bad:#C93650;--badbg:#FBE6EA;--chip:#ECE9F7;--shadow:0 1px 2px rgba(21,19,31,.05),0 10px 30px rgba(21,19,31,.06);--show-d:inline-block;--show-l:none;
--serif:"Instrument Serif",Georgia,"Times New Roman",serif;--sans:"DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0D0C14;--paper:#17161F;--paper2:#201F2B;--ink:#F2F1F6;--ink2:#B4B2C3;--ink3:#807E92;--line:#2C2B39;--night:#08070D;--night2:#15141F;--accent:#1FE0AE;--ok:#3BD69C;--okbg:#10291F;--warn:#F0B44C;--warnbg:#2B2110;--bad:#FF7088;--badbg:#2E141A;--chip:#262338;--shadow:none;--show-d:none;--show-l:inline-block;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0D0C14;--paper:#17161F;--paper2:#201F2B;--ink:#F2F1F6;--ink2:#B4B2C3;--ink3:#807E92;--line:#2C2B39;--night:#08070D;--night2:#15141F;--accent:#1FE0AE;--ok:#3BD69C;--okbg:#10291F;--warn:#F0B44C;--warnbg:#2B2110;--bad:#FF7088;--badbg:#2E141A;--chip:#262338;--shadow:none;--show-d:none;--show-l:inline-block;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:400}
p{margin:0}
.serif{font-family:var(--serif);font-weight:400;letter-spacing:-.01em}
.serif em,em.it{font-style:italic}
.wrap{max-width:1240px;margin:0 auto}
.mut{color:var(--ink2)}.small{font-size:13px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3)}
.proto{max-width:1240px;margin:0 auto;padding-top:8px;font-size:12px;color:var(--ink3);display:flex;gap:8px;align-items:center}
.proto i{width:7px;height:7px;border-radius:50%;background:var(--accent);display:inline-block}
/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line);margin:0 calc(-1 * max(16px,env(safe-area-inset-right,0px))) 0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.hin{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:20px;min-height:64px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:8px;text-decoration:none;flex:0 0 auto}
.logo img{height:22px;width:auto}.logo .lgd{display:var(--show-d)}.logo .lgl{display:var(--show-l)}
.logo .mk{font-family:var(--serif);font-style:italic;font-size:22px;color:var(--brand);line-height:1}
.logo .alt{font-weight:700;font-size:18px;letter-spacing:-.02em}
nav#nav{display:flex;gap:2px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
nav#nav::-webkit-scrollbar{display:none}
nav#nav a{text-decoration:none;padding:8px 12px;border-radius:999px;color:var(--ink2);font-weight:500;font-size:14px;white-space:nowrap}
nav#nav a:hover{color:var(--ink);background:var(--paper2)}
nav#nav a.on{color:var(--ink);background:var(--paper);box-shadow:var(--shadow);outline:1px solid var(--line)}
.hr{display:flex;align-items:center;gap:8px;margin-left:auto}
.ib{width:38px;height:38px;display:grid;place-items:center;border-radius:50%;color:var(--ink2);text-decoration:none;border:1px solid var(--line);background:var(--paper)}
.cxb{display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;background:var(--ink);color:var(--bg);text-decoration:none;font-weight:600;font-size:14px}
.cxb svg{color:var(--accent)}
.pts{font-size:13px;font-weight:600;color:var(--ink2);padding:0 4px;white-space:nowrap}
.av{width:38px;height:38px;border-radius:50%;border:0;background:var(--brand);color:#fff;font-weight:700;font-size:13px;cursor:pointer;flex:0 0 auto}
.menu{position:fixed;z-index:40;top:calc(70px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));width:290px;background:var(--paper);border:1px solid var(--line);border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.18);padding:10px}
.menu .who{padding:10px 10px 12px;border-bottom:1px solid var(--line);margin-bottom:6px}
.menu a,.menu button.mi{display:flex;width:100%;text-align:left;padding:9px 10px;border-radius:10px;text-decoration:none;border:0;background:none;cursor:pointer;font-size:14px}
.menu a:hover,.menu button.mi:hover{background:var(--paper2)}
.menu .rl{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:6px 4px}
.menu .rl button{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:7px;font-size:12px;cursor:pointer}
.menu .rl button.on{border-color:var(--brand);color:var(--brand);font-weight:600}
main{min-height:70vh;padding-block:28px 60px}
footer{max-width:1240px;margin:0 auto;padding:28px 0 calc(28px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);color:var(--ink3);font-size:13px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:11px 20px;font-weight:600;font-size:14px;cursor:pointer;text-decoration:none;white-space:nowrap;line-height:1.2}
.btn.pri{background:var(--brand);color:#fff}
.btn.dark{background:var(--ink);color:var(--bg)}
.btn.light{background:#fff;color:#15131F}
.btn.line{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.ghost-w{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.25)}
.btn.ok{background:var(--okbg);color:var(--ok)}
.btn.danger{background:var(--badbg);color:var(--bad)}
.btn.sm{padding:8px 14px;font-size:13px}
.btn.wide{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.dash{border:1.5px dashed var(--line);border-radius:999px;padding:8px 16px;font-size:12px;font-weight:700;letter-spacing:.1em;text-decoration:none;color:var(--ink);white-space:nowrap}
.dash:hover{border-color:var(--ink)}
/* sections & rows */
.sec{margin-top:56px}
.sh{display:flex;align-items:baseline;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.sh h2{font-family:var(--serif);font-size:clamp(30px,4vw,42px);line-height:1}
.sh .cnt{font-size:13px;font-weight:600;letter-spacing:.1em;color:var(--ink3);text-transform:uppercase}
.sh .sp{margin-left:auto}
.row{display:flex;align-items:flex-start;gap:20px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:8px;scrollbar-width:thin}
.row>*{scroll-snap-align:start}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:24px 20px}
/* course card */
.cc{flex:0 0 330px;max-width:100%;text-decoration:none;display:block;min-width:0}
.grid .cc{flex:auto}
.cv{position:relative;aspect-ratio:16/10;border-radius:22px;overflow:hidden;background:var(--night);isolation:isolate}
.cv img{position:absolute;top:0;right:0;width:62%;height:100%;object-fit:cover;object-position:center 22%;filter:grayscale(1) contrast(1.08) brightness(.9);transition:filter .5s,transform .6s;z-index:-1}
.cv::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--night) 38%,color-mix(in srgb,var(--night) 60%,transparent) 52%,transparent 75%);z-index:0}
.cc:hover .cv img,.cv.color img{filter:none;transform:scale(1.04)}
.cv .tg{position:absolute;top:14px;left:16px;display:flex;align-items:center;gap:6px;color:#fff;font-size:11px;font-weight:700;letter-spacing:.08em;z-index:1}
.cv .tg i{width:8px;height:8px;background:var(--brand);transform:rotate(45deg);display:inline-block}
.cv .ttl{position:absolute;left:16px;bottom:14px;width:52%;color:#fff;font-family:var(--serif);font-size:25px;line-height:1.02;z-index:1}
.cv .who{position:absolute;right:12px;top:12px;background:rgba(10,9,16,.7);backdrop-filter:blur(6px);color:#fff;font-size:10px;padding:5px 9px;border-radius:999px;z-index:1;max-width:44%;line-height:1.2}
.cv .who b{display:block;font-size:8px;letter-spacing:.12em;opacity:.7;font-weight:600}
.cv .pg{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.15);z-index:1}
.cv .pg i{display:block;height:100%;background:var(--accent)}
.cv .lock{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.45);color:#fff;font-size:13px;font-weight:600;z-index:2}
.cc .ct{display:block;margin-top:12px;font-size:17px;font-weight:600;line-height:1.3}
.cc .cs{display:block;color:var(--ink3);font-size:14px;margin-top:2px}
/* hero */
.hero{position:relative;border-radius:30px;overflow:hidden;background:var(--night);color:#fff;min-height:440px;display:flex;isolation:isolate}
.hero>img{position:absolute;right:0;top:0;width:58%;height:100%;object-fit:cover;z-index:-1}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--night) 40%,color-mix(in srgb,var(--night) 50%,transparent) 60%,transparent 85%);z-index:0}
.hero .hc{position:relative;z-index:1;padding:44px;max-width:620px;display:flex;flex-direction:column;justify-content:center;gap:18px}
.hero h1{font-family:var(--serif);font-size:clamp(40px,6vw,72px);line-height:.98}
.hero p{color:rgba(255,255,255,.75);font-size:16px;max-width:46ch}
.live{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:6px 12px;font-size:12px;font-weight:700;letter-spacing:.1em}
.live i{width:8px;height:8px;border-radius:50%;background:#FF4D6D;animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.3}}
.hbtn{display:flex;gap:10px;flex-wrap:wrap}
.stats{margin-top:20px;background:var(--night);color:#fff;border-radius:26px;padding:28px 32px;display:grid;grid-template-columns:repeat(4,1fr) auto;gap:20px;align-items:center}
.stats div{font-size:15px;color:rgba(255,255,255,.7)}
.stats b{display:block;font-family:var(--serif);font-weight:400;font-size:40px;color:#fff;line-height:1}
.stats img{height:24px}
/* panels */
.card{background:var(--paper);border:1px solid var(--line);border-radius:22px}
.pad{padding:24px}
.cxpromo{display:grid;grid-template-columns:1.1fr 1fr;gap:0;overflow:hidden}
.cxpromo .shot{background:var(--paper2);padding:24px;display:grid;grid-template-columns:1fr 1.2fr;gap:12px;align-items:stretch}
.mini-chat{background:var(--paper);border-radius:14px;padding:12px;font-size:11px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow)}
.mini-chat .u{align-self:flex-end;background:var(--chip);padding:6px 10px;border-radius:10px}
.mini-chat .a{color:var(--ink2);line-height:1.4}
.mini-vid{border-radius:14px;background:var(--night);position:relative;overflow:hidden;min-height:180px}
.mini-vid img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.75}
.cxpromo .txt{padding:40px;display:flex;flex-direction:column;gap:14px;justify-content:center}
.cxpromo h2{font-family:var(--serif);font-size:clamp(32px,4vw,46px);line-height:1}
/* page heads */
.ph{display:flex;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:28px}
.ph h1{font-family:var(--serif);font-size:clamp(40px,6vw,64px);line-height:.95}
.ph p{max-width:60ch;margin-top:10px}
.ph .act{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:500;cursor:pointer;color:var(--ink2)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.fbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.inp,select.inp,textarea.inp{border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:10px 14px;font-size:14px;min-width:0}
.inp:focus{outline:2px solid color-mix(in srgb,var(--brand) 40%,transparent);border-color:var(--brand)}
.srch{flex:1;min-width:200px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--ink2)}
label.f .inp{font-weight:400;color:var(--ink)}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--chip);color:var(--ink2);white-space:nowrap}
.pill.ok{background:var(--okbg);color:var(--ok)}.pill.warn{background:var(--warnbg);color:var(--warn)}.pill.bad{background:var(--badbg);color:var(--bad)}.pill.br{background:color-mix(in srgb,var(--brand) 14%,transparent);color:var(--brand)}
/* disciplina */
.dhero{position:relative;border-radius:30px;overflow:hidden;background:var(--night);color:#fff;isolation:isolate;min-height:360px;display:flex}
.dhero>img{position:absolute;right:0;top:0;width:55%;height:100%;object-fit:cover;object-position:center 20%;z-index:-1}
.dhero::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--night) 42%,color-mix(in srgb,var(--night) 40%,transparent) 65%,transparent);z-index:0}
.dhero .hc{position:relative;z-index:1;padding:40px;max-width:640px;display:flex;flex-direction:column;gap:14px;justify-content:flex-end}
.dhero h1{font-family:var(--serif);font-size:clamp(38px,5.5vw,62px);line-height:1}
.dhero .meta{display:flex;gap:16px;flex-wrap:wrap;color:rgba(255,255,255,.7);font-size:14px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:28px 0 20px;overflow-x:auto}
.tabs button{border:0;background:none;padding:12px 14px;font-weight:600;font-size:14px;color:var(--ink3);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button.on{color:var(--ink);border-color:var(--ink)}
.lsn{display:flex;align-items:center;gap:16px;padding:16px 4px;border-bottom:1px solid var(--line);text-decoration:none}
.lsn:hover .lt{color:var(--brand)}
.lsn .ln{font-family:var(--serif);font-size:30px;color:var(--ink3);width:44px;flex:0 0 auto}
.lsn .lt{font-weight:600;font-size:16px}
.lsn .ls{color:var(--ink3);font-size:13px}
.lsn .lr{margin-left:auto;flex:0 0 auto}
.ck{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line);color:transparent}
.ck.on{background:var(--ok);border-color:var(--ok);color:#fff}
.two{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:28px;align-items:start}
/* aula */
.crumb{margin-bottom:14px;font-size:14px}.crumb a{text-decoration:none;color:var(--ink2)}
.ag{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:24px;align-items:start}
.player{position:relative;aspect-ratio:16/9;border-radius:22px;overflow:hidden;background:#000;cursor:pointer}
.player img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.55;filter:grayscale(.6)}
.player .ov{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:20px;color:#fff}
.player .pb{width:76px;height:76px;border-radius:50%;background:#fff;color:#111;display:grid;place-items:center;align-self:center;margin-top:auto;margin-bottom:auto;box-shadow:0 10px 40px rgba(0,0,0,.4)}
.player .bar{height:4px;background:rgba(255,255,255,.25);border-radius:4px;overflow:hidden}
.player .bar i{display:block;height:100%;width:0;background:var(--accent);transition:width 8s linear}
.player.playing .bar i{width:100%}
.player .tt{font-family:var(--serif);font-size:28px;line-height:1.05;max-width:70%}
.ah{display:flex;gap:16px;align-items:flex-start;margin:18px 0 22px;flex-wrap:wrap}
.ah h1{font-family:var(--serif);font-size:clamp(28px,3.4vw,40px);line-height:1.05;margin-top:4px}
.ah .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.side{position:sticky;top:calc(80px + env(safe-area-inset-top,0px));background:var(--paper);border:1px solid var(--line);border-radius:22px;overflow:hidden;display:flex;flex-direction:column;max-height:calc(100vh - 100px)}
.side .tabs{margin:0;padding:0 10px}
.sb{padding:18px;overflow:auto;flex:1;min-height:0}
.cx{display:flex;flex-direction:column;height:100%;min-height:420px}
.cxh{display:flex;align-items:center;gap:8px;font-weight:700}
.cxh svg{color:var(--brand)}
.cxh span{font-weight:400;color:var(--ink3);font-size:13px}
.msgs{flex:1;overflow:auto;display:flex;flex-direction:column;gap:12px;padding:14px 0;min-height:200px}
.m{max-width:92%;font-size:14px;line-height:1.55}
.m.u{align-self:flex-end;background:var(--chip);padding:9px 13px;border-radius:16px 16px 4px 16px}
.m.a{align-self:flex-start}
.m.a ul{margin:6px 0;padding-left:18px}
.m.a p+p{margin-top:8px}
.m .demo{display:block;margin-top:6px;font-size:11px;color:var(--ink3)}
.m .think{color:var(--ink3);font-style:italic}
.src{display:inline-flex;align-items:center;gap:5px;background:color-mix(in srgb,var(--brand) 10%,transparent);color:var(--brand);border-radius:8px;padding:2px 8px;font-size:13px;text-decoration:none;font-weight:600;margin:2px 0}
.qs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.qs button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 11px;font-size:12px;cursor:pointer;color:var(--ink2)}
.qs button:hover{border-color:var(--brand);color:var(--brand)}
.cxf{display:flex;gap:8px;border:1px solid var(--line);border-radius:16px;padding:6px 6px 6px 14px;background:var(--bg)}
.cxf input{flex:1;border:0;background:none;outline:none;min-width:0;font-size:14px}
.cxf button{width:38px;height:38px;border-radius:12px;border:0;background:var(--ink);color:var(--bg);display:grid;place-items:center;cursor:pointer;flex:0 0 auto}
.quiz .op{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px 14px;margin-top:8px;cursor:pointer}
.quiz .op.right{border-color:var(--ok);background:var(--okbg)}
.quiz .op.wrong{border-color:var(--bad);background:var(--badbg)}
/* cortex page */
.cxpage{max-width:860px;margin:0 auto}
.cxpage .msgs{min-height:300px}
.cxpage .hello{text-align:center;padding:30px 0 10px}
.cxpage .hello h1{font-family:var(--serif);font-size:clamp(40px,6vw,64px);line-height:1}
.cxpage .qs{justify-content:center}
/* library */
.refs{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.ref{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:8px;min-width:0}
.ref.hl{outline:2px solid var(--brand)}
.ref .rt{font-weight:600;font-size:16px;line-height:1.35}
.ref .rf{font-size:13px;color:var(--ink3)}
.ref .rw{font-size:14px;color:var(--ink2)}
.ref .ra{display:flex;gap:6px;margin-top:auto;padding-top:8px;flex-wrap:wrap}

Quem pergunta: ${u.nome}, ${u.cargo}, área de ${u.area}, organização ${u.org}.
${ctx?`Aula aberta agora: "${ctx.a.t}", da trilha "${ctx.c.n}" (especialista: ${ctx.c.m}). Pontos da aula: ${pontos(ctx.c,ctx.i).join("; ")}.`:"A pessoa está na página geral do Córtex, sem aula aberta."}
Quando recomendar uma aula, escreva exatamente o código entre colchetes, por exemplo [aula 4-1]. Quando recomendar uma referência da biblioteca, escreva [ref 7]. Recomende no máximo 3 itens e nunca invente códigos fora destas listas.
Aulas disponíveis:
${catalogo()}
Biblioteca de referências:
${biblio()}
Banco de IA aplicada da TD (dor → solução criada pela TD · ferramentas):
${MCASES.map(c=>`${c.a}: ${c.dor} → ${c.sol} (${c.tl.join(", ")})`).join("\n")}
Outras criações da TD: ${MCRI.map(c=>c[0]+" ("+c[1]+")").join("; ")}
Ferramentas de mercado do banco: ${MTOOLS.filter(t=>!t.td).map(t=>t.n+" ("+t.d+")").join("; ")}`;}
function demoAnswer(q,ctx){const s=q.toLowerCase();const u=S.user;
 let c=ctx?ctx.c:null;
 if(!c){const hit=comps().find(x=>s.split(/\W+/).some(w=>w.length>4&&(x.n.toLowerCase().includes(w)||getAulas(x).some(a=>a.t.toLowerCase().includes(w)))));c=hit||getComp(2);}
 const refs=allRefs().filter(r=>r.c.some(x=>c.cp.includes(x))&&!r.cur).slice(0,2);
 if(/resum/.test(s)&&ctx)return `**Resumo da aula em 4 pontos**\n${pontos(ctx.c,ctx.i).map(p=>"- "+p).join("\n")}\nPara aprofundar: ${refs.map(r=>`[ref ${r.id}]`).join(" ")}`;
 if(/exempl/.test(s))return `Pensando na área de ${u.area} da ${u.org}:\n- Escolha **uma decisão que se repete toda semana** e anote quais informações vocês usam hoje.\n- Aplique o que a aula mostra em ${c.s} só nessa decisão, por 30 dias.\n- Compare o resultado com o mês anterior e leve para a comunidade.\nVeja também [aula ${c.id}-${Math.min(2,getAulas(c).length-1)}].`;
 if(/refer|ler|leitura|biblioteca|livro/.test(s))return `Da biblioteca da escola, eu começaria por:\n${refs.map(r=>`- [ref ${r.id}]: ${r.w}`).join("\n")}\nTodas estão salvas no repositório, com o link original.`;
 if(/pergunt|test|quiz|prova/.test(s))return `**Três perguntas para testar o que você aprendeu**\n- Qual decisão da sua área mudaria se você aplicasse ${c.s} amanhã?\n- Que informação falta hoje para essa decisão?\n- Quem precisa estar junto para a mudança durar?\nResponda nas suas anotações. O especialista vê as respostas na comunidade.`;
 return `Boa pergunta. Pelo que a escola trabalha em **${c.n}**, o caminho é:\n- Entender o conceito em [aula ${c.id}-0]\n- Ver a aplicação prática em [aula ${c.id}-${Math.min(1,getAulas(c).length-1)}]\n${refs[0]?`- Ler [ref ${refs[0].id}]`:""}\nSe quiser, me diga a sua situação e eu monto um roteiro de estudo para a semana.`;}
function md(t){let h=esc(t);
 h=h.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");
 h=h.replace(/\[aula (\d+)-(\d+)\]/gi,(m,c,i)=>{const cc=getComp(c);const a=cc&&getAulas(cc)[+i];return a?`<a class="src" href="#aula-${c}-${i}">${ic("play",11)} ${esc(a.t)}</a>`:""});
 h=h.replace(/\[ref (\d+)\]/gi,(m,id)=>{const r=refById(id);return r?`<a class="src" href="#biblioteca" data-act="openref" data-x="${r.id}">${ic("book",11)} ${esc(r.t)}</a>`:""});
 const out=[];let ul=null;
 h.split("\n").forEach(l=>{const t=l.trim();if(/^([-•*]|\d+\.)\s+/.test(t)){if(!ul){ul=[];out.push(ul);}ul.push(t.replace(/^([-•*]|\d+\.)\s+/,""));}else{ul=null;if(t)out.push(t);}});
 return out.map(x=>Array.isArray(x)?`<ul>${x.map(li=>`<li>${li}</li>`).join("")}</ul>`:`<p>${x}</p>`).join("");}
function renderMsgs(key){const el=document.getElementById("msgs");if(!el||el.dataset.k!==key)return;const L=CH[key]||[];
 el.innerHTML=L.length?L.map(m=>m.r==="u"?`<div class="m u">${esc(m.t)}</div>`:`<div class="m a">${m.pending&&!m.t?'<span class="think">Pensando…</span>':md(m.t)}${m.demo?'<span class="demo">Resposta de demonstração. Com o Córtex ligado, ele responde a partir das aulas e da biblioteca.</span>':""}</div>`).join(""):`<div class="m a mut">${key==="geral"?"":key.startsWith("expert-")?"Sou a IA treinada no acervo deste Expert. Conte o seu desafio ou escolha uma pergunta abaixo.":"Estou acompanhando esta aula com você. Pause o vídeo e pergunte o que quiser."}</div>`;
 el.scrollTop=el.scrollHeight;}
async function ask(key,q,ctx){q=q.trim();if(!q)return;S.cxAsk=1;save();CH[key]=CH[key]||[];const L=CH[key];
 if(L.some(m=>m.pending))return;
 L.push({r:"u",t:q});const m={r:"a",t:"",pending:true};L.push(m);renderMsgs(key);
 const sample=await spReady;
 if(sample){
  const hist=L.slice(0,-1).map((x,i)=>({role:x.r==="u"?"user":"assistant",content:(i===0?preamble(ctx)+"\n\nPergunta: ":"")+(x.t||"(sem resposta)")}));
  try{await sample(hist,{modelTier:"quick",cache:false,onText:({text})=>{m.t=text;m.pending=false;renderMsgs(key);}});m.pending=false;renderMsgs(key);return;}
  catch(e){if(e&&e.text){m.t=e.text;m.pending=false;renderMsgs(key);return;}}
 }
 await new Promise(r=>setTimeout(r,700));
 m.t=demoAnswer(q,ctx);m.demo=true;m.pending=false;renderMsgs(key);addPts(5,"+5 pontos por estudar com o Córtex");}

A.certificados=()=>`<div class="ph" style="margin-bottom:18px"><div><h1 style="font-size:48px">Certificados</h1><p class="mut">Regras de emissão automática, emissão manual para eventos presenciais e registro de todos os certificados.</p></div><div class="act"><button class="btn dark" data-act="emit">${ic("plus",16)} Emitir para um evento</button></div></div>

function wheel(sel){const N=MSEGS.length,st=2*Math.PI/N,CX=300,CY=300,RO=262,RI=130,P=(r,a)=>`${(CX+r*Math.cos(a)).toFixed(1)},${(CY+r*Math.sin(a)).toFixed(1)}`;let h="";
 MSEGS.forEach((s,k)=>{const a0=-Math.PI/2-st/2+k*st+.012,a1=a0+st-.024,m=(a0+a1)/2;const [tx,ty]=P((RO+RI)/2,m).split(",");
  h+=`<g class="wseg ${sel===k?"on":""} ${k%2?"o":""}" data-act="wseg" data-x="${k}" tabindex="0" role="button" aria-label="${esc(s)}"><path d="M${P(RO,a0)}A${RO} ${RO} 0 0 1 ${P(RO,a1)}L${P(RI,a1)}A${RI} ${RI} 0 0 0 ${P(RI,a0)}Z"/><text x="${tx}" y="${+ty+5}">${esc(s)}</text></g>`;});
 return `<svg viewBox="0 0 600 600" class="wheel" role="img" aria-label="Mandala da Inteligência: 11 áreas da TD">${h}<circle cx="300" cy="300" r="120" fill="#00FFB6"/><circle cx="300" cy="300" r="120" fill="none" stroke="#120845" stroke-width="6"/><text x="300" y="300" class="wc">TD</text><text x="300" y="330" class="ws">inteligência</text><text x="300" y="350" class="ws">aplicada</text></svg>`;}
function wpanel(k){if(k<0)return `<span class="mey">Clique em uma área da mandala</span><p class="mp">Cada fatia é uma área da TD. Veja a dor do dia a dia, a solução que a própria equipe criou e as ferramentas usadas.</p><div class="mstat"><div><b>11 de 11</b>áreas usam inteligência artificial</div><div><b>21</b>criações próprias em 9 áreas</div><div><b>35</b>ferramentas em uso</div></div>`;
 const cs=MCASES.filter(c=>c.k===k),cr=MCRI.filter(c=>c[2]===k),tl=MTOOLS.filter(t=>t.td&&t.td.includes(k));
 return `<span class="mey">Área · ${esc(MSEGS[k])}</span>${cs.map(mcase).join("")}${cr.length?`<span class="mey" style="margin-top:14px">Criações da área</span><ul class="mcr">${cr.map(c=>`<li><b>${esc(c[0])}</b> · ${esc(c[1])}</li>`).join("")}</ul>`:""}<span class="mey" style="margin-top:14px">Ferramentas que a área usa</span><div class="mtl">${tl.map(t=>toolChip(t.n)).join("")}</div>`;}

function msearch(q){UI.mq=q;const STOP=["muito","tempo","perco","minha","minhas","nosso","nossa","para","como","fazer","quero","preciso","todo","toda","sempre","muita","porque","with"];const w=norm(q).split(/[^a-z0-9]+/).filter(x=>x.length>3&&!STOP.includes(x));const el=$("#mres");if(!el)return;if(!w.length){el.innerHTML="";return;}
 const sc=MPROB.map(p=>{const k=norm(p.kw+" "+p.p);return [p,w.reduce((s,x)=>s+(k.includes(x)||k.includes(x.slice(0,5))?1:0),0)];}).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]).slice(0,3);
 el.innerHTML=sc.length?`<div class="mres">${sc.map(([p])=>{const cs=p.c>=0?MCASES.find(c=>c.k===p.c):null;const cr=p.cri?MCRI.find(c=>c[0]===p.cri):null;return `<div class="mrc"><span class="mdor">${esc(p.p)}</span>${cs?`<span class="msol"><i>→</i> ${esc(cs.sol)}</span><span class="mar">Criado pela TD · ${esc(cs.a)}</span>`:cr?`<span class="msol"><i>→</i> ${esc(cr[0])}</span><span class="mar">Criado pela TD · ${esc(MSEGS[cr[2]])}</span><span style="font-size:13px;color:#CFC6F5">${esc(cr[1])}</span>`:`<span class="msol"><i>→</i> Ferramentas de mercado</span><span class="mar">A TD ainda não tem uma criação própria para isso</span>`}<span class="mey" style="margin-top:8px">Ferramentas sugeridas</span><div class="mtl">${p.t.map(toolChip).join("")}</div></div>`;}).join("")}</div><button class="btn sm" style="margin-top:12px;background:rgba(255,255,255,.1);color:#fff" data-act="mcortex">${ic("spark",14)} Detalhar com o Córtex</button>`:`<div class="mrc"><span class="msol">Não encontramos um caso parecido.</span><span class="mar">Descreva com outras palavras ou pergunte ao Córtex.</span><button class="btn sm" style="margin-top:10px;background:#00FFB6;color:#120845;align-self:flex-start" data-act="mcortex">${ic("spark",14)} Perguntar ao Córtex</button></div>`;}

const pad=n=>String(n).padStart(2,"0");
function term(k){const t=(brand().t)||{};return t[k]||{membro:"Membro",membros:"Membros",mentor:"Expert",hub:brand().nome}[k];}

function staff(){return ["admin","especialista"].includes(role());}
function myOrg(){return S.user?S.orgs.find(o=>o.n===S.user.org):null;}

function passLvl(v){return v>=4?"Referência":v>=3?"Praticante":"Explorador";}

function lvlOf(p){let r=LEVELS[0],nx=null;LEVELS.forEach((l,i)=>{if(p>=l[1]){r=l;nx=LEVELS[i+1]||null;}});return {n:r[0],next:nx};}

let LAST="";
function route(){const h=decodeURIComponent((location.hash||"").slice(1));const parts=h.split("-");let v=parts[0]||"inicio";let a=parts.slice(1);

 if(S.user&&v==="entrar")v="inicio";
 if(v==="experiencias")v="eventos";
 if(!V[v])v="inicio";
 if(v==="equipe"&&!["gestor","admin"].includes(role()))v="inicio";
 if(v==="admin"&&!["admin","especialista"].includes(role()))v="inicio";

document.addEventListener("change",e=>{const t=e.target;
 if(t.dataset.lead){const l=S.leads.find(x=>x.id===+t.dataset.lead);if(l){l.st=t.value;save();toast("Status atualizado");}}
 if(t.dataset.tpl){fileTo(t,d=>{UI.tplImg=UI.tplImg||{};UI.tplImg[t.dataset.tpl]=d;tplPreview();});}
 if(t.dataset.logo){fileTo(t,d=>{UI.logoData=d;toast("Logo carregado");});}
 if(t.closest&&t.closest("#tf"))tplPreview();
 if(t.dataset.f==="lc"){UI.lc=t.value;listRefs();}
 if(["up","uo","us"].includes(t.dataset.f)){UI[t.dataset.f]=t.value;UI.upage=1;listUsers();}if(t.dataset.f==="at"){UI.at=t.value;auditRefresh();}});
document.addEventListener("submit",e=>{const f=e.target;e.preventDefault();const fd=new FormData(f);
 if(admSubmit(f,fd))return;
 if(f.id==="hcxf"){const q=$("#hcxq").value.trim();if(q)goAsk(q);return;}
 if(f.id==="seatf"){const t=f.dataset.x,n=fd.get("p");S.seats=Object.assign({},S.seats);S.seats[t]=(S.seats[t]||[]).filter(x=>x!==n).concat([n]);save();closeAll();toast(`${n} indicado(a) para ${t}`);rr();return;}
 if(f.dataset.cx){const i=f.querySelector("input");const q=i.value;i.value="";ask(f.dataset.cx,q,CURCTX);return;}
 if(f.id==="lgf"){const em=$("#lgmail").value;$("#lgbox").innerHTML=`<div class="sent">${ic("check",16)} Enviamos um link de acesso para <b>${esc(em)}</b>. Ele vale por 15 minutos.</div><button class="btn pri wide" style="margin-top:10px" data-act="login" data-x="membro">Abrir o link (protótipo)</button>`;S._em=em;return;}
 if(f.id==="lf"){const c=getComp(f.dataset.x);leadAdd({origem:"Trilha bloqueada",interesse:c.n,destino:"Escola",eq:fd.get("eq"),msg:fd.get("msg")});closeAll();toast("Pedido enviado. O comercial da TD fala com você em até 1 dia útil");return;}
 if(f.id==="npsf"){const n=fd.get("n");if(n===""){toast("Escolha uma nota de 0 a 10");return;}S.nps.unshift({n:+n,tr:f.dataset.tr,c:fd.get("c")||"",data:today()});save();closeAll();addPts(20,"Obrigado pela avaliação · +20 pontos");return;}
 if(f.id==="tf"){const o=tplFromForm(f);S.ctpl=S.ctpl.map(t=>t.id===o.id?o:t);save();closeAll();toast("Modelo de certificado salvo");rr();return;}
 if(f.id==="df"){const org=fd.get("org"),nm=fd.get("n");const nid=Math.max(100,...S.newTr.map(t=>t.id))+1;let o;
  if(f.dataset.mode==="new"){o={id:nid,n:nm,s:nm.toLowerCase(),g:"Própria do cliente",com:"",m:"Especialista convidado",cp:[9],img:"img/e3.jpg",d:"Descreva o objetivo da trilha.",para:"Defina o público.",ent:"Defina a entrega prática.",temas:[["Primeiro tema","Descreva em uma frase",9]]};}
  else{const c=getComp(f.dataset.id);o=JSON.parse(JSON.stringify(c));delete o.aulas;delete o.novo;o.temas=getAulas(c).map(a=>[a.t,a.f,a.k]);Object.assign(o,{id:nid,n:nm,s:nm.toLowerCase(),piloto:0});}
  Object.assign(o,{org,status:"Rascunho"});S.newTr=S.newTr.concat([o]);save();closeAll();toast(`Trilha criada para ${org}, como rascunho`);rr();setTimeout(()=>compModal(nid),100);return;}
 if(f.id==="bf"){const k=f.dataset.k||("c"+Date.now());const ex=S.brands[k];const org=String(fd.get("org")).trim();
  const b=Object.assign(ex||{},{nome:fd.get("nome"),org,alt:org.split(" ").slice(-2).join(" "),mk:fd.get("mk")||"Escola",brand:fd.get("brand"),accent:fd.get("accent"),dom:fd.get("dom"),t:{membro:fd.get("membro")||"Membro",membros:fd.get("membros")||"Membros",mentor:fd.get("mentor")||"Mentor"}});if(UI.logoData)b.logoImg=UI.logoData;
  if(!ex){b.ctpl="eleven";if(fd.get("dupc")){const tid="t"+Date.now();S.ctpl=S.ctpl.concat([Object.assign(clone(S.ctpl[0]),{id:tid,nome:b.nome,bg:"",cbg:dark(b.brand),ca:b.accent,cp:b.brand,logoL:b.logoImg||"",logoLT:b.logoImg?"":b.nome,emissor:`A ${org} certifica que`,ass:"Diretoria",cargo:org,sig:""})]);b.ctpl=tid;}}
  S.brands=Object.assign({},S.brands,{[k]:b});let o=S.orgs.find(x=>x.marca===k&&k!=="td")||S.orgs.find(x=>x.n===org);if(!o){o={n:org,tipo:"Cliente · marca própria",lic:0,val:"2027-12-31",grupos:[],marca:k,acesso:"Link de acesso por e-mail"};S.orgs=S.orgs.concat([o]);}
  Object.assign(o,{n:org,marca:k,lic:+fd.get("lic")||0,grupos:fd.getAll("grupos")});S.orgs=S.orgs.slice();S.brand=k;save();closeAll();toast(ex?"Marca salva":`Pronto: esta é a escola da ${org}`);if(!ex){location.hash="#inicio";}rr();return;}
 if(f.id==="vf"){verify($("#vcode").value);return;}
 if(f.id==="mf"){msearch($("#mq").value);return;}
 if(f.id==="pf"){Object.assign(S.user,{nome:fd.get("nome")||S.user.nome,cargo:fd.get("cargo"),area:fd.get("area"),li:fd.get("li")});save();toast("Perfil atualizado");rr();return;}
 if(f.id==="uf"){const u=S.users.find(x=>x.id===+f.dataset.id);audit("Editou usuário",fd.get("nome"),"Dados e acessos");Object.assign(u,{nome:fd.get("nome"),email:fd.get("email"),org:fd.get("org"),perfil:fd.get("perfil"),turma:fd.get("turma"),val:fd.get("val"),status:fd.get("status"),grupos:fd.getAll("grupos")});S.users=S.users.slice();save();closeAll();toast(`${u.nome} atualizado`);rr();return;}
 if(f.id==="if"){const ems=String(fd.get("em")).split(/[\s,;]+/).filter(x=>/@/.test(x));const org=fd.get("org")||(S.user.org);let id=Math.max(...S.users.map(u=>u.id))+1;ems.forEach(em=>{S.users.push({id:id++,nome:em.split("@")[0].replace(/[._]/g," ").replace(/\b\w/g,c=>c.toUpperCase()),email:em,org,perfil:fd.get("perfil")||"membro",turma:fd.get("turma"),status:"Convite pendente",ult:"—",val:"2027-12-31",grupos:GRUPOS.slice(),prog:0});});save();closeAll();toast(`${ems.length} convite(s) enviado(s) (simulado)`);rr();return;}
 if(f.id==="of"){const o=S.orgs[+f.dataset.k];Object.assign(o,{n:fd.get("n"),lic:+fd.get("lic"),val:fd.get("val"),marca:fd.get("marca"),acesso:fd.get("acesso"),grupos:fd.getAll("grupos")});S.orgs=S.orgs.slice();save();closeAll();toast("Organização salva");rr();return;}
 if(f.id==="cf"){const id=+f.dataset.id;const rows=[...f.querySelectorAll("[data-row]")].map(r=>({t:r.querySelector('[name="at"]').value.trim()||"Tema sem título",f:r.querySelector('[name="af"]').value.trim(),dur:+r.querySelector('[name="ad"]').value||10}));S.ed[id]={n:fd.get("n"),s:fd.get("s"),m:fd.get("m"),status:fd.get("status"),aulas:rows};save();closeAll();toast("Trilha salva. O catálogo já mostra a mudança");rr();return;}
 if(f.id==="rf"){S.rules={aulas:+fd.get("aulas"),nota:+fd.get("nota"),exp:+fd.get("exp")};save();toast("Regras salvas");return;}
 if(f.id==="ef"){const ps=String(fd.get("ps")).split("\n").map(x=>x.trim()).filter(Boolean);ps.forEach(p=>S.certs.unshift({cod:code(),u:p,tit:fd.get("tit"),tipo:"Experiência presencial",data:today(),h:fd.get("h"),st:"Válido"}));save();closeAll();toast(`${ps.length} certificado(s) emitido(s)`);rr();return;}
 if(f.id==="sf"){const id=Date.now();const it={id,t:fd.get("t"),f:`Sugerido por ${S.user.nome}`,c:+fd.get("c"),tp:fd.get("tp"),u:fd.get("u"),w:fd.get("w")};S.fila=S.fila.concat([it]);S.refsX=S.refsX.concat([{id,tp:it.tp,t:it.t,f:it.f,a:"2026",c:[it.c],u:it.u||"",w:it.w||"Sugestão de membro.",cur:1}]);save();closeAll();toast("Sugestão enviada para a curadoria");rr();return;}
});
function readCSV(e){const file=e.target.files[0];if(!file)return;const rd=new FileReader();rd.onload=()=>{const lines=String(rd.result).split(/\r?\n/).filter(Boolean);const hd=lines.shift().toLowerCase().split(",").map(s=>s.trim());let id=Math.max(...S.users.map(u=>u.id))+1,n=0;
 lines.forEach(l=>{const v=l.split(",").map(s=>s.trim());const o={};hd.forEach((h,i)=>o[h]=v[i]||"");if(!/@/.test(o.email||""))return;S.users.push({id:id++,nome:o.nome||o.email,email:o.email,org:o.organizacao||"Turma aberta",perfil:ROLES[o.perfil]?o.perfil:"membro",turma:o.turma||"",status:"Convite pendente",ult:"—",val:"2027-12-31",grupos:GRUPOS.slice(),prog:0});n++;});
 save();$("#csvres").innerHTML=`<div class="sent">${n} pessoa(s) importada(s) com convite pendente.</div>`;if($("#list"))listUsers();};rd.readAsText(file);}
window.addEventListener("hashchange",route);
route();
</script>
